# Production stack: PostgreSQL + API + executor + Nuxt SSR + Nginx reverse proxy.
# Copy .env.example to .env and set real secrets before `docker compose up -d --build`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-geeks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-geeks}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geeks}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      COOKIE_SECURE: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
      EXECUTOR_URL: http://executor:5000
      EXECUTOR_KEY: ${EXECUTOR_KEY:?set EXECUTOR_KEY}
    networks: [internal]

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      EXECUTOR_KEY: ${EXECUTOR_KEY}
      EXECUTOR_DRIVER: docker
      DOCKER_BIN: docker
      MAX_CONCURRENT_RUNS: 4
      WORK_DIR: /work
    volumes:
      # Docker-outside-of-Docker: the executor asks the host daemon to run sandboxed containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - executor_work:/work
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      NUXT_API_BASE: http://backend:4000/api
      NUXT_API_PROXY_TARGET: http://backend:4000
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

volumes:
  postgres_data:
  executor_work:

networks:
  internal:
